services:
  - type: web
    name: my-education-institute
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: my-education-postgres
          property: connectionString

databases:
  - name: my-education-postgres
    plan: starter
    databaseName: my_education
    user: my_education_user
