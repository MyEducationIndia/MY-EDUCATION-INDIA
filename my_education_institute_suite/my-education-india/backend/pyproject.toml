[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-education-india-backend"
version = "1.0.0"
description = "Enterprise Modular Monolith ERP & LMS Backend for MY EDUCATION INDIA"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "sentry-sdk[fastapi]>=2.14.0",
    "cloudinary>=1.41.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
