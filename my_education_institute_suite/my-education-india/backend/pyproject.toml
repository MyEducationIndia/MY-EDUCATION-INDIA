[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-education-india-erp"
version = "2.0.0"
description = "Enterprise Modular Monolith ERP for MY EDUCATION INDIA (National Flagship Campus)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "MY EDUCATION INDIA DevOps Team", email = "devops@myeducation.in" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "sentry-sdk>=1.40.0",
    "email-validator>=2.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
