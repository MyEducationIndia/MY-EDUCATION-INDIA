services:
  - type: web
    name: my-education-institute
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install --only-binary=:all: -r requirements.txt && (alembic upgrade head || true) && (python3 -m app.db.seed_data || true)
    preDeployCommand: alembic upgrade head && python3 -m app.db.seed_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_0Cqr1tHSoYBL@ep-bitter-forest-aol9sp4e-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
