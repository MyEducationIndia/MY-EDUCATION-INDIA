version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: my_education_postgres
    restart: always
    environment:
      POSTGRES_DB: my_education
      POSTGRES_USER: my_education_user
      POSTGRES_PASSWORD: my_education_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_education_user -d my_education"]
      interval: 10s
      timeout: 5s
      retries: 5

  suite-web:
    build: .
    container_name: my_education_erp_app
    restart: always
    environment:
      - PROJECT_NAME=MY EDUCATION INSTITUTE
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://my_education_user:my_education_secure_pass@postgres:5432/my_education
      - INACTIVITY_TIMEOUT_MINUTES=10
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: my_education_erp_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - suite-web

volumes:
  pgdata:
