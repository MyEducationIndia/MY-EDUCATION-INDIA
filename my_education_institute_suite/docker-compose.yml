version: '3.8'

services:
  suite-web:
    build: .
    container_name: my_education_erp_app
    restart: always
    environment:
      - PROJECT_NAME=MY EDUCATION INSTITUTE
      - ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/suite.db
      - INACTIVITY_TIMEOUT_MINUTES=10
    volumes:
      - erp_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: my_education_erp_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - suite-web

volumes:
  erp_data:
