[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "my-education-india-erp"
version = "2.0.0"
description = "Enterprise Modular Monolith ERP for MY EDUCATION INDIA (National Flagship Campus)"
authors = ["MY EDUCATION INDIA DevOps Team <devops@myeducation.in>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
gunicorn = ">=21.2.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.27"}
greenlet = ">=3.0.3"
asyncpg = ">=0.29.0"
psycopg2-binary = ">=2.9.9"
alembic = ">=1.13.1"
[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
gunicorn = ">=21.2.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.27"}
greenlet = ">=3.0.3"
asyncpg = ">=0.29.0"
psycopg = {extras = ["binary"], version = ">=3.1.18"}
psycopg2-binary = ">=2.9.9"
alembic = ">=1.13.1"
pydantic = ">=2.5.3"
pydantic-settings = ">=2.1.0"
pyjwt = ">=2.8.0"
pwdlib = {extras = ["argon2"], version = ">=0.2.0"}
python-multipart = ">=0.0.6"
httpx = ">=0.26.0"
sentry-sdk = ">=1.40.0"
email-validator = ">=2.1.0"
cryptography = ">=42.0.0"
redis = ">=5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.5"
httpx = ">=0.26.0"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "sentry-sdk>=1.40.0",
    "email-validator>=2.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.1"
]
ruff = ">=0.2.0"
mypy = ">=1.8.0"

# Backward compatibility with standard pip install . (PEP 621)
[project]
name = "my-education-india-erp"
version = "2.0.0"
description = "Enterprise Modular Monolith ERP for MY EDUCATION INDIA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "sentry-sdk>=1.40.0",
    "email-validator>=2.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.1"
]
